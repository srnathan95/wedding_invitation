  <link rel="stylesheet" href="assets/temple/style.css" />
</head>
<body>

<!-- ══ PRELOADER ══════════════════════════════════════════ -->
<div id="preloader" class="preloader">
  <div class="pl-content">
    <div class="pl-mandala-wrap">
      <svg class="pl-mandala" width="120" height="120" viewBox="0 0 120 120" fill="none"
           xmlns="http://www.w3.org/2000/svg">
        <!-- Concentric rings — stroke-dasharray animated in CSS -->
        <circle class="pl-m-ring pl-m-r1" cx="60" cy="60" r="26"
                stroke="#C8960A" stroke-width="1.4"/>
        <circle class="pl-m-ring pl-m-r2" cx="60" cy="60" r="40"
                stroke="rgba(200,150,10,.70)" stroke-width="1.2"/>
        <circle class="pl-m-ring pl-m-r3" cx="60" cy="60" r="54"
                stroke="rgba(200,150,10,.45)" stroke-width="1.0"/>
        <!-- 8 petals -->
        <g class="pl-m-petals" opacity="0">
          <ellipse cx="60" cy="36" rx="5" ry="11" fill="rgba(200,150,10,.55)" transform="rotate(0 60 60)"/>
          <ellipse cx="60" cy="36" rx="5" ry="11" fill="rgba(200,150,10,.45)" transform="rotate(45 60 60)"/>
          <ellipse cx="60" cy="36" rx="5" ry="11" fill="rgba(200,150,10,.55)" transform="rotate(90 60 60)"/>
          <ellipse cx="60" cy="36" rx="5" ry="11" fill="rgba(200,150,10,.45)" transform="rotate(135 60 60)"/>
          <ellipse cx="60" cy="36" rx="5" ry="11" fill="rgba(200,150,10,.55)" transform="rotate(180 60 60)"/>
          <ellipse cx="60" cy="36" rx="5" ry="11" fill="rgba(200,150,10,.45)" transform="rotate(225 60 60)"/>
          <ellipse cx="60" cy="36" rx="5" ry="11" fill="rgba(200,150,10,.55)" transform="rotate(270 60 60)"/>
          <ellipse cx="60" cy="36" rx="5" ry="11" fill="rgba(200,150,10,.45)" transform="rotate(315 60 60)"/>
        </g>
        <!-- Centre dot -->
        <circle class="pl-m-dot" cx="60" cy="60" r="5" fill="#C8960A"/>
      </svg>
    </div>
    <div class="pl-names">
      <span></span>
      <span class="pl-weds">weds</span>
      <span></span>
    </div>
  </div>
</div>

<!-- ══ CUSTOM CURSOR ══════════════════════════════════════ -->
<div class="c-ring" id="cRing"></div>
<div class="c-dot"  id="cDot"></div>

<!-- ══ MUSIC TOGGLE ══════════════════════════════════════ -->
<button class="music-btn" id="musicBtn" aria-label="Toggle music">🎵</button>
<audio id="bgMusic" loop preload="none">
  <!-- Replace with your own music file -->
  <!-- <source src="assets/temple/music.mp3" type="audio/mpeg"> -->
</audio>

<!-- ══ HERO ══════════════════════════════════════════════ -->
<div class="hero-wrap" id="heroWrap">
  <div class="hero-pin" id="heroPin">

    <!-- Spark particles -->
    <div class="hero-particles" id="heroParticles"></div>

    <!-- Atmospheric orbs -->
    <div class="rangoli-orb rangoli-orb--1" aria-hidden="true"></div>
    <div class="rangoli-orb rangoli-orb--2" aria-hidden="true"></div>
    <div class="rangoli-orb rangoli-orb--3" aria-hidden="true"></div>

    <!-- Background layer -->
    <div class="hero-bg-layer">
      <img class="hero-bg-img hero-bg-img--desktop"
           src="assets/temple/Hero_background_Desktop.png"
           alt="" aria-hidden="true" fetchpriority="high" />
      <img class="hero-bg-img hero-bg-img--mobile"
           src="assets/temple/Hero_background_Mobile.png"
           alt="" aria-hidden="true" fetchpriority="high" />
    </div>

    <!-- Subject (gopuram/temple) — zooms on scroll -->
    <div class="hl-subject-wrap">
      <img id="hlSubjectDesktop"
           class="hl-subject hl-subject--desktop"
           src="assets/temple/Hero_subject_Desktop.png"
           alt="Temple backdrop" fetchpriority="high" />
      <img id="hlSubjectMobile"
           class="hl-subject hl-subject--mobile"
           src="assets/temple/Hero_subject_Mobile.png"
           alt="Temple backdrop" fetchpriority="high" />
    </div>

    <!-- Foreground (banana leaves) — gentle sway -->
    <div class="hl-fg-wrap" id="hlFgWrap">
      <img class="hl-fg hl-fg--desktop"
           src="assets/temple/Hero_foreground_Desktop.png"
           alt="" aria-hidden="true" />
      <img class="hl-fg hl-fg--mobile"
           src="assets/temple/Hero_foreground_Mobile.png"
           alt="" aria-hidden="true" />
    </div>

    <!-- Floating elements: diyas + falling leaves -->
    <div class="hero-floats" aria-hidden="true">
      <img class="fl diya-l" src="assets/temple/Element 1.png" alt="" />
      <img class="fl diya-r" src="assets/temple/Element 1.png" alt="" />
      <img class="fl fall-l" src="assets/temple/Element 5.png" alt="" />
      <img class="fl fall-r" src="assets/temple/Element 6.png" alt="" />
    </div>

    <!-- Hero names + countdown -->
    <div class="hero-copy" id="heroCopy">
      <div class="hc-bride"><span></span></div>
      <div class="hc-weds">weds</div>
      <div class="hc-groom"><span></span></div>
      <div id="heroCountdown" class="hc-countdown" aria-live="polite"></div>
    </div>

    <!-- Scroll nudge -->
    <div class="scroll-nudge" id="scrollNudge" aria-hidden="true">
      <span>Scroll</span>
      <div class="sn-line"><div class="sn-dot"></div></div>
    </div>

    <!-- Petal canvas -->
    <div class="petal-canvas" id="petalHero" aria-hidden="true"></div>

  </div><!-- /hero-pin -->
</div><!-- /hero-wrap -->


<!-- ══ WATER BRIDGE ═══════════════════════════════════════ -->
<div class="water-bridge" aria-hidden="true">
  <div class="wb-sky"></div>
  <div class="wb-horizon"></div>

  <div class="wb-water-wrap">

    <!-- Wave 1 — back / deep, slowest -->
    <div class="wb-wave wb-wave--1">
      <svg viewBox="0 0 2800 320" preserveAspectRatio="none"
           width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
        <path d="M0,190 C116,148 232,230 466,190
                 C700,148 816,230 1050,190
                 C1284,148 1400,230 1634,190
                 C1868,148 1984,230 2218,190
                 C2452,148 2568,230 2800,190
                 L2800,320 L0,320 Z"
              fill="#52100D"/>
      </svg>
    </div>

    <!-- Wave 2 — mid shimmer -->
    <div class="wb-wave wb-wave--2">
      <svg viewBox="0 0 2800 320" preserveAspectRatio="none"
           width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
        <path d="M0,205 C88,168 175,245 350,205
                 C525,165 612,242 875,205
                 C1138,168 1225,245 1400,205
                 C1575,165 1662,242 1925,205
                 C2188,168 2275,245 2450,205
                 C2625,165 2712,242 2800,205
                 L2800,320 L0,320 Z"
              fill="#6E1512" fill-opacity="0.85"/>
      </svg>
    </div>

    <!-- Wave 3 — surface / front, fastest -->
    <div class="wb-wave wb-wave--3">
      <svg viewBox="0 0 2800 320" preserveAspectRatio="none"
           width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
        <path d="M0,222 C70,198 140,248 280,222
                 C420,196 490,246 700,222
                 C910,198 980,248 1120,222
                 C1260,196 1330,246 1540,222
                 C1750,198 1820,248 1960,222
                 C2100,196 2170,246 2380,222
                 C2590,198 2660,248 2800,222
                 L2800,320 L0,320 Z"
              fill="#8B1A15" fill-opacity="0.90"/>
      </svg>
    </div>
  </div><!-- /wb-water-wrap -->

  <!-- Golden shimmer streaks -->
  <div class="wb-shimmer">
    <div class="wb-sh wb-sh--1"></div>
    <div class="wb-sh wb-sh--2"></div>
    <div class="wb-sh wb-sh--3"></div>
    <div class="wb-sh wb-sh--4"></div>
  </div>

  <!-- Ripple rings -->
  <div class="wb-ripple wb-ripple--l1"></div>
  <div class="wb-ripple wb-ripple--l2"></div>
  <div class="wb-ripple wb-ripple--r1"></div>
  <div class="wb-ripple wb-ripple--r2"></div>

  <!-- Swan A — glides right → left -->
  <div class="wb-swan wb-swan--a">
    <div class="wb-swan-wake wb-swan-wake--a"></div>
    <img class="wb-swan-img" src="assets/temple/Element_7.png" alt="Swan" />
  </div>

  <!-- Swan B — glides left → right -->
  <div class="wb-swan wb-swan--b">
    <div class="wb-swan-wake wb-swan-wake--b"></div>
    <img class="wb-swan-img wb-swan-img--flip" src="assets/temple/Element_8.png" alt="Swan" />
  </div>

  <div class="wb-veil-bottom"></div>
</div><!-- /water-bridge -->


<!-- ══ INVITATION ═════════════════════════════════════════ -->
<section class="s-invite" id="invite">

  <!-- Animated water background -->
  <div class="si-water-bg" aria-hidden="true">
    <div class="si-water-base"></div>
    <div class="si-wave si-wave--1">
      <svg viewBox="0 0 2800 400" preserveAspectRatio="none"
           width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
        <path d="M0,230 C140,185 280,275 560,230
                 C840,185 980,275 1260,230
                 C1540,185 1680,275 1960,230
                 C2240,185 2380,275 2660,230
                 C2750,205 2800,230 2800,230
                 L2800,400 L0,400 Z"
              fill="#480A0A" fill-opacity="0.70"/>
      </svg>
    </div>
    <div class="si-wave si-wave--2">
      <svg viewBox="0 0 2800 400" preserveAspectRatio="none"
           width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
        <path d="M0,250 C116,210 232,290 466,250
                 C700,210 816,290 1050,250
                 C1284,210 1400,290 1634,250
                 C1868,210 1984,290 2218,250
                 C2452,210 2568,290 2800,250
                 L2800,400 L0,400 Z"
              fill="#5C0E0E" fill-opacity="0.60"/>
      </svg>
    </div>
    <div class="si-shimmer" aria-hidden="true">
      <div class="si-sh si-sh--1"></div>
      <div class="si-sh si-sh--2"></div>
      <div class="si-sh si-sh--3"></div>
      <div class="si-sh si-sh--4"></div>
      <div class="si-sh si-sh--5"></div>
    </div>
    <div class="si-glow"></div>
  </div>

  <!-- Floating lotus elements -->
  <div class="si-lotuses" aria-hidden="true">
    <img class="si-lotus si-lotus--1" src="assets/temple/Element_7.png" alt="" />
    <img class="si-lotus si-lotus--2" src="assets/temple/Element_8.png" alt="" />
    <img class="si-lotus si-lotus--3" src="assets/temple/Element_7.png" alt="" />
    <img class="si-lotus si-lotus--4" src="assets/temple/Element_8.png" alt="" />
    <img class="si-lotus si-lotus--5" src="assets/temple/Element_7.png" alt="" />
  </div>

  <!-- Toran (banana-flower garland) -->
  <div class="toran" aria-hidden="true">
    <img class="toran-img" src="assets/temple/Background 4.png" alt="" />
  </div>

  <div class="container">
    <div class="invite-card scroll-in">

      <!-- Corner ornaments -->
      <svg class="card-tl" width="48" height="48" viewBox="0 0 48 48" fill="none"
           aria-hidden="true">
        <path d="M4,44 L4,4 L44,4" stroke="rgba(200,150,10,.50)"
              stroke-width="1.5" fill="none"/>
        <circle cx="4" cy="4" r="3" fill="rgba(200,150,10,.65)"/>
      </svg>
      <svg class="card-tr" width="48" height="48" viewBox="0 0 48 48" fill="none"
           aria-hidden="true">
        <path d="M44,44 L44,4 L4,4" stroke="rgba(200,150,10,.50)"
              stroke-width="1.5" fill="none"/>
        <circle cx="44" cy="4" r="3" fill="rgba(200,150,10,.65)"/>
      </svg>

      <!-- Ganesha -->
      <div class="i-ganesha">
        <img class="i-ganesha-img"
             src="assets/temple/Element 4.png"
             alt="Ganesha blessing" />
      </div>

      <!-- Gold rule -->
      <div class="i-rule">
        <svg width="240" height="14" viewBox="0 0 240 14" fill="none"
             aria-hidden="true">
          <line x1="0"   y1="7" x2="100" y2="7"
                stroke="rgba(200,150,10,.45)" stroke-width="0.8"/>
          <path d="M110,7 C115,2 125,2 120,7 C125,12 115,12 110,7 Z"
                fill="rgba(200,150,10,.65)"/>
          <circle cx="120" cy="7" r="2.5" fill="#C8960A"/>
          <path d="M130,7 C135,2 145,2 140,7 C145,12 135,12 130,7 Z"
                fill="rgba(200,150,10,.65)"/>
          <line x1="140" y1="7" x2="240" y2="7"
                stroke="rgba(200,150,10,.45)" stroke-width="0.8"/>
        </svg>
      </div>

      <p class="i-bless"></p>
      <p class="i-label"></p>

      <!-- Names -->
      <div class="i-names">
        <span class="i-bride"></span>
        <span class="i-amp">&amp;</span>
        <span class="i-groom"></span>
      </div>

      <!-- Family -->
      <div class="i-fam">
        <div class="fam-side">
          <p class="fam-gp"></p>
          <p class="fam-parents"></p>
        </div>
        <span class="fam-dot">◆</span>
        <div class="fam-side">
          <p class="fam-gp"></p>
          <p class="fam-parents"></p>
        </div>
      </div>

      <p class="i-close"></p>
    </div><!-- /invite-card -->
  </div>

  <div class="petal-canvas" id="petalInvite" aria-hidden="true"></div>
</section>


<!-- ══ EVENTS ═════════════════════════════════════════════ -->
<section class="s-events" id="events">
  <img class="bg-fill" src="assets/temple/Background 6.png"
       alt="" aria-hidden="true" />
  <div class="ev-paper-veil" aria-hidden="true"></div>

  <!-- Floating leaves -->
  <img class="fl fall-l" src="assets/temple/Element 5.png"
       alt="" aria-hidden="true" style="position:absolute" />
  <img class="fl fall-r" src="assets/temple/Element 6.png"
       alt="" aria-hidden="true" style="position:absolute" />

  <!-- Journey SVG line (mobile only) -->
  <div class="ev-journey-wrap" aria-hidden="true">
    <svg id="evJourneySvg" style="position:absolute;top:0;left:0;">
      <path id="ejTrack" class="ej-track" fill="none"/>
      <path id="ejDrawn" class="ej-drawn" fill="none"/>
    </svg>
  </div>

  <div class="container">
    <div class="s-head scroll-in">
      <span class="sh-eye">The Celebrations</span>
      <h2 class="sh-h">Our <em>Events</em></h2>
      <div class="sh-line-wrap">
        <svg class="sh-line-svg" width="240" height="20"
             viewBox="0 0 240 20" fill="none" aria-hidden="true">
          <path class="sh-leaf-path"
                d="M10,10 C40,2 70,18 110,10 C130,6 150,14 165,10
                   C180,6 200,18 230,10"
                stroke="rgba(200,150,10,.55)" stroke-width="1.6"
                fill="none" stroke-linecap="round"/>
        </svg>
      </div>
    </div>

    <div class="ev-float-stage" id="evStage" data-ev-count="0"
         style="--ev-cols:3">
    </div><!-- /ev-float-stage -->
  </div>

  <div class="petal-canvas" id="petalEvents" aria-hidden="true"></div>
</section>


<!-- ══ LEAF DIVIDER ═══════════════════════════════════════ -->
<div class="leaf-div" aria-hidden="true">
  <svg viewBox="0 0 1440 56" preserveAspectRatio="none"
       xmlns="http://www.w3.org/2000/svg">
    <path d="M0,28 C120,48 240,8 480,28 C600,38 720,18 960,28
             C1080,33 1200,22 1320,28 C1380,31 1410,29 1440,28
             L1440,56 L0,56 Z"
          fill="#E8E0F4"/>
    <path d="M0,28 C120,8 240,48 480,28 C600,18 720,38 960,28
             C1080,22 1200,33 1320,28 C1380,31 1410,29 1440,28"
          fill="none" stroke="rgba(200,150,10,.18)" stroke-width="1"/>
  </svg>
</div>


<!-- ══ STORY / CURTAIN REVEAL ═════════════════════════════ -->
<section class="s-story" id="story">
  <div class="st-paper-bg" aria-hidden="true"></div>

  <div class="st-stage" id="stStage">

    <!-- Spinning mandala (backdrop) -->
    <div class="st-reveal" id="stReveal">
      <svg class="st-mandala" width="420" height="420" viewBox="0 0 420 420"
           fill="none" aria-hidden="true">
        <circle cx="210" cy="210" r="190" stroke="rgba(200,150,10,.12)"
                stroke-width="1"/>
        <circle cx="210" cy="210" r="145" stroke="rgba(200,150,10,.09)"
                stroke-width="1"/>
        <circle cx="210" cy="210" r="100" stroke="rgba(200,150,10,.08)"
                stroke-width="1"/>
        <!-- 12 petals -->
        <g opacity="0.18">
          <ellipse cx="210" cy="60"  rx="10" ry="26" fill="#C8960A" transform="rotate(0 210 210)"/>

<script src="assets/temple/script.js"></script>
<script>
/* Music toggle */
(function(){
  var btn  = document.getElementById('musicBtn');
  var aud  = document.getElementById('bgMusic');
  if(!btn || !aud) return;
  btn.addEventListener('click', function(){
    if(aud.paused){
      aud.play().then(function(){btn.classList.add('playing');btn.textContent='🔇';})
        .catch(function(){});
    } else {
      aud.pause();
      btn.classList.remove('playing');
      btn.textContent='🎵';
    }
  });
})();
</script>
